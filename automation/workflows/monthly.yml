# Reminder/evidence checklist only; no automatic backup restore or access changes.
name: Monthly operations review
on:
  workflow_dispatch:
  schedule:
    - cron: '17 11 1 * *'
permissions:
  contents: read
jobs:
  review:
    if: vars.ENABLE_MONTHLY_REVIEW == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1, official tag verified 2026-10-28
        with:
          persist-credentials: false
      - name: Publish human review checklist
        run: cat automation/monthly-checks.md >> "$GITHUB_STEP_SUMMARY"
